<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>성서 히브리어 퀴즈</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>성서 히브리어 퀴즈</h1>
        <p>“내 눈을 열어서 주의 율법에서 놀라운 것을 보게 하소서” 시 119:18</p>
      </div>
      <button id="resetBtn" class="ghost danger">기록 초기화</button>
    </header>

    <nav class="tabs" aria-label="퀴즈 메뉴">
      <button class="tab active" data-view="quiz">문제 풀이</button>
      <button class="tab" data-view="wrong">오답노트 <span id="wrongCountBadge">0</span></button>
      <button class="tab" data-view="wrongQuiz">오답만 다시 풀기</button>
    </nav>

    <main>
      <section id="quizView" class="view active">
        <div class="mode-picker" aria-label="문제 유형">
          <button class="mode-btn active" data-mode="consonant">자음</button>
          <button class="mode-btn" data-mode="vowel">모음</button>
          <button class="mode-btn" data-mode="combined">자음 + 모음</button>
        </div>

        <div class="stats-grid">
          <div class="stat-card"><span>진행</span><strong id="progressText">0 / 0</strong></div>
          <div class="stat-card"><span>정답률</span><strong id="accuracyText">0%</strong></div>
          <div class="stat-card"><span>정답</span><strong id="correctText">0</strong></div>
          <div class="stat-card"><span>오답</span><strong id="wrongText">0</strong></div>
        </div>

        <section class="quiz-card">
          <div class="question-head">
            <span id="modeLabel" class="pill">자음</span>
            <span id="questionNo">문제 0 / 0</span>
          </div>

          <div class="hebrew-wrap">
            <div id="hebrewGlyph" class="hebrew-glyph" dir="rtl">א</div>
            <div id="questionHint" class="question-hint">이 자음의 이름을 입력하세요.</div>
          </div>

          <form id="answerForm" autocomplete="off">
            <label for="answerInput">정답</label>
            <div class="answer-row">
              <input id="answerInput" type="text" placeholder="예: 알레프" autocomplete="off" />
              <button id="submitBtn" type="submit" class="primary">제출</button>
            </div>
          </form>

          <div id="feedback" class="feedback" aria-live="polite"></div>
          <div class="actions">
            <button id="skipBtn" class="ghost">건너뛰기</button>
            <button id="nextBtn" class="primary hidden">다음 문제</button>
          </div>
        </section>
      </section>

      <section id="wrongView" class="view">
        <div class="section-title">
          <div><h2>오답노트</h2><p>틀린 글자와 내가 쓴 답, 정답을 확인할 수 있습니다.</p></div>
          <button id="clearWrongBtn" class="ghost danger">오답노트 비우기</button>
        </div>
        <div id="wrongList" class="wrong-list"></div>
      </section>

      <section id="wrongQuizView" class="view">
        <div class="empty-panel">
          <h2>오답만 다시 풀기</h2>
          <p id="wrongQuizGuide">오답이 생기면 여기서 다시 풀 수 있습니다.</p>
          <button id="startWrongQuizBtn" class="primary">오답 복습 시작</button>
        </div>
      </section>
    </main>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
